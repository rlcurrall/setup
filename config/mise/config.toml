[settings]
idiomatic_version_file_enable_tools = ["dotnet"]
# A shared root lets SDKs and runtimes coexist for multi-targeted projects.
dotnet.isolated = false

[tools]
# Follow updates within each major while the remaining .NET 8 projects migrate.
dotnet = ["10", "8"]
node = "latest"
pnpm = "latest"
bun = "latest"
deno = "latest"
go = "latest"
"npm:oxfmt" = "latest"
